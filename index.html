<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1c3a22">
  <title>Fairway Golf Core</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102a18;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#315f35,#102a18 68%);z-index:99999;text-align:center;padding:24px}
    #boot strong{display:block;font-size:clamp(27px,7vw,58px);letter-spacing:.04em}
    #boot span{display:block;margin-top:12px;opacity:.78;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
    #error{display:none;max-width:520px;line-height:1.55}
  </style>
</head>
<body>
  <div id="boot">
    <div id="loading"><strong>FAIRWAY GOLF CORE</strong><span>Loading the proven 3D golf engine…</span></div>
    <div id="error"><strong>COURSE COULD NOT LOAD</strong><span>Refresh the page to try again.</span></div>
  </div>
  <script>
    (async function loadGolfCore(){
      const source='https://fairway-legends.vercel.app/';
      try{
        const response=await fetch(source,{cache:'no-store'});
        if(!response.ok) throw new Error('Golf source returned '+response.status);
        let html=await response.text();
        html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+source+'"><title>Fairway Golf Core</title>');
        const directStart='<script>window.addEventListener("load",function(){setTimeout(function(){try{if(typeof startMode==="function")startMode("quick",1);var home=document.getElementById("menubtn");if(home)home.style.display="none";document.title="Fairway Golf Core";}catch(err){console.error("Golf Core direct start failed",err);}},160);});<'+'/script>';
        html=html.replace(/<\/body>/i,directStart+'</body>');
        document.open();document.write(html);document.close();
      }catch(error){
        console.error(error);
        document.getElementById('loading').style.display='none';
        document.getElementById('error').style.display='block';
      }
    })();
  </script>
</body>
</html>
